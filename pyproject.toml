[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipedit"
version = "0.1.0"
description = "A small GUI for viewing and editing SIP packets inside PCAP files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haris Khalid" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scapy>=2.5.0",
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sipedit = "sipedit.app:main"

[tool.setuptools.packages.find]
include = ["sipedit*"]
